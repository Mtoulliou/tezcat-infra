# ==========================================================================
#  TEZCAT — Configuration Ansible
# ==========================================================================
[defaults]
inventory            = inventory.ini
remote_user          = tezcatadmin
private_key_file     = ~/.ssh/tezcat_ed25519
host_key_checking    = False          # pratique en R&D (1er contact) ; à durcir plus tard
retry_files_enabled  = False
interpreter_python   = auto_silent

[privilege_escalation]
become        = True
become_method = sudo
