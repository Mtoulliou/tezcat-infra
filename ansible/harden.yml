---
# ==========================================================================
#  TEZCAT — Durcissement de base des 8 VM
#  Applique : paquets de base, fuseau horaire, SSH clé-only,
#             fail2ban, mises à jour de sécurité automatiques
# ==========================================================================
- name: Durcissement de base
  hosts: all_vms
  become: true

  tasks:
    - name: Créer le dossier de configuration systemd-resolved
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Configurer le DNS (systemd-resolved)
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-tezcat-dns.conf
        content: |
          [Resolve]
          DNS=1.1.1.1 1.0.0.1
          FallbackDNS=9.9.9.9
        mode: "0644"
      notify: Redémarrer systemd-resolved

    - name: Empêcher cloud-init de réécrire la config réseau
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        mode: "0644"

    - name: Mettre à jour l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets de base
      ansible.builtin.apt:
        name:
          - fail2ban
          - unattended-upgrades
          - qemu-guest-agent
        state: present

    - name: Régler le fuseau horaire
      ansible.builtin.command: timedatectl set-timezone Europe/Paris
      changed_when: false

    - name: Déployer les clés SSH des administrateurs
      ansible.posix.authorized_key:
        user: tezcatadmin
        key: "{{ item }}"
        state: present
      loop:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAFCHB4hhuBpc9yUr7k4Aq46eiRgnFvcqpffme9B7eJ7 matteo@tezcat"
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMMgukXFhXjvHd92wBeiFPUlwjts869BJsCDC9WbvhUV jules@tezcat"
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJmGPyfqtTgJ06Mh2p+tyMiVunBjlEw5Pxu6XzwLWlZb maxime@tezcat" 

    - name: Durcir SSH (pas de root, pas de mot de passe)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        owner: root
        group: root
        mode: "0644"
      notify: Redémarrer ssh

    - name: Activer fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Activer les mises à jour de sécurité automatiques
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    - name: Route retour vers les clients WireGuard (zones DMZ/DMZCLIENT)
      ansible.builtin.copy:
        dest: /etc/systemd/system/tezcat-route-vpn.service
        content: |
          [Unit]
          Description=Route retour vers les clients WireGuard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/sbin/ip route replace 10.0.0.0/16 via {{ wg_gateway }}
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      when: inventory_hostname in (groups['dmz'] + groups['dmzclient'] + groups['fw'])
      notify: Activer la route VPN

  handlers:
    - name: Redémarrer systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted

    - name: Redémarrer ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Activer la route VPN
      ansible.builtin.systemd:
        name: tezcat-route-vpn
        enabled: true
        state: restarted
        daemon_reload: true