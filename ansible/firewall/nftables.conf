#!/usr/sbin/nft -f

flush ruleset

# ----------------------------- INTERFACES ---------------------------------
define WAN_IF  = "eth0"    # patte domestique  → 192.168.1.27 (uplink box)
define DMZ_IF  = "eth1"    # patte DMZ         → 10.1.0.254
define PROD_IF = "eth2"    # patte PROD        → 10.2.0.254
define DMZC_IF = "eth3"    # patte DMZCLIENT   → 10.3.0.254

# ------------------------------- RÉSEAUX ----------------------------------
define DMZ_NET  = 10.1.0.0/24
define PROD_NET = 10.2.0.0/24
define DMZC_NET = 10.3.0.0/24

# --------------------------------- HÔTES ----------------------------------
define EDGE   = 10.1.0.1        # Nginx + Certbot + Web-Front (DMZ)
define WG     = 10.1.0.3        # WireGuard, patte DMZ
define GITLAB = 10.2.0.2        # GitLab (+ Runner)  (PROD)
define ELK    = 10.2.0.1        # ELK / Kibana       (PROD)
define APP    = 10.2.0.3        # Web-Back + Postgres (PROD)
define IA     = 10.3.0.2        # IA                 (DMZCLIENT)
define PVE    = 192.168.1.26    # hôte Proxmox (réseau domestique)

# ------------------------ PLAGES VPN (WireGuard) --------------------------
define VPN_ADMIN  = 10.0.0.0/24
define VPN_DEV    = 10.0.1.0/24
define VPN_SHIELD = 10.0.2.0/24 

# --------------------------- PORTS applicatifs ----------------------------
define APP_PORT = 8000          # ⚠️ à confirmer selon ton Web-Back

# ==========================================================================
#  TABLE FILTRE (inet = IPv4 + IPv6)
# ==========================================================================
table inet filter {

    # ------------------------- CHAÎNE INPUT -------------------------------
    # Trafic à DESTINATION du firewall lui-même
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Ping (diagnostic)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # SSH vers le firewall : depuis le réseau domestique + admins VPN
        ip saddr 192.168.1.0/24 tcp dport 22 accept
        ip saddr $VPN_ADMIN     tcp dport 22 accept

        # (tout le reste est droppé par la policy)
    }

    # ------------------------ CHAÎNE FORWARD ------------------------------
    # Trafic ROUTÉ à travers le firewall (inter-zones, egress, DNAT entrant)
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Sessions déjà établies : on laisse revenir
        ct state established,related accept
        ct state invalid drop

        # ---- ENTRÉES depuis Internet (après DNAT, voir table nat) --------
        iifname $WAN_IF ip daddr $EDGE tcp dport { 80, 443 } accept   # HTTP/S → Nginx
        iifname $WAN_IF ip daddr $WG   udp dport 51820        accept   # VPN → WireGuard

        # ---- DMZ → PROD -------------------------------------------------
        ip saddr $EDGE ip daddr $APP tcp dport $APP_PORT accept        # Nginx → Web-Back (/api)

        # ---- DMZCLIENT → PROD -------------------------------------------
        ip saddr $IA ip daddr $ELK tcp dport 9200 accept               # IA → ELK (lecture logs)

        # ---- Flux VPN (via WireGuard) -----------------------------------
        # Admins : Kibana, GitLab, SSH partout, Proxmox
        ip saddr $VPN_ADMIN ip daddr $ELK    tcp dport 5601 accept     # Kibana
        ip saddr $VPN_ADMIN ip daddr $GITLAB tcp dport { 443, 22, 2222 } accept
        ip saddr $VPN_ADMIN ip daddr $PVE    tcp dport 8006 accept     # Proxmox
        ip saddr $VPN_ADMIN tcp dport 22 accept                        # SSH sur tous les hôtes

        # Devs : GitLab uniquement
        ip saddr $VPN_DEV ip daddr $GITLAB tcp dport { 443, 22, 2222 } accept

        # Shields clients : envoi des logs vers ELK
        ip saddr $VPN_SHIELD ip daddr $ELK tcp dport 5044 accept       # Filebeat → Logstash

        # ---- EGRESS Internet (mises à jour, certbot, registries) --------
        # Zones internes autorisées à sortir (DNS + HTTP/S). NAT en postrouting.
        iifname { $DMZ_IF, $PROD_IF, $DMZC_IF } oifname $WAN_IF \
            tcp dport { 53, 80, 443 } accept
        iifname { $DMZ_IF, $PROD_IF, $DMZC_IF } oifname $WAN_IF \
            udp dport 53 accept

        # (tout flux non listé est droppé par la policy — deny by default)
    }

    # ------------------------- CHAÎNE OUTPUT ------------------------------
    # Trafic ÉMIS par le firewall lui-même (large en R&D)
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# ==========================================================================
#  TABLE NAT
# ==========================================================================
table ip nat {

    # ------- PREROUTING : DNAT des entrées Internet vers les services -----
    # (le port-forward de ta box envoie 80/443/51820 vers 192.168.1.27)
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        iifname $WAN_IF tcp dport { 80, 443 } dnat to $EDGE
        iifname $WAN_IF udp dport 51820       dnat to $WG
    }

    # ------- POSTROUTING : masquerade des zones internes vers Internet ----
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        oifname $WAN_IF ip saddr { $DMZ_NET, $PROD_NET, $DMZC_NET } masquerade
    }
}